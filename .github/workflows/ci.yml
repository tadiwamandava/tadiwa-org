name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing useful to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ordered cheapest-first so a typo fails in seconds rather than after a
      # full build. `typecheck` runs `next typegen` first — without it, route
      # types lag behind newly added routes and typecheck fails on files that
      # are actually correct.
      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Parses the real token blocks out of globals.css and asserts WCAG AA in
      # both themes, plus parity between the two dark blocks. Fails the build.
      - name: Contrast (WCAG AA, both themes)
        run: npm run check:contrast

      # Validates every MDX file against the Zod corpus schema.
      - name: Content schema
        run: npm run check:content

      # Runs the shipped lexical index through the shipped scorer. Guards
      # against the two copies of tokenize() (build script vs runtime) drifting
      # apart, which would break search silently and without any error.
      # The index artefacts are committed, so this needs no model download.
      - name: Search quality
        run: npm run check:search

      # The admin is the only thing in this repo that WRITES content, so it is
      # the only thing that can destroy it. This round-trips every file in
      # content/ through the admin's own serialiser and asserts the reparse is
      # deep-equal — plus adversarial YAML scalars, schema/editor field
      # coverage, and that invalid content throws instead of reaching disk.
      - name: Admin write-path
        run: npm run check:admin

      # tadiwa-nano's op-parity tests. Builds with clang++ (no Emscripten
      # needed) and passes while the kernels are still stubs — an unstarted op
      # reports as "stub", not as a failure, so the gate goes red only when an
      # implemented op actually diverges from its golden fixture.
      - name: Inference op parity
        run: npm run test:nano

      # End-to-end: replays a fixed prompt through the full C++ forward pass —
      # KV cache included — and diffs the final logits against the PyTorch
      # model the weights were exported from. The op tests cannot catch a
      # transposed weight or a mis-sliced head; this can. Needs no Python: the
      # reference logits are committed as a fixture.
      - name: Inference logit parity
        run: npm run test:nano:parity

      - name: Build
        run: npm run build

      # Sums the JS the home page actually ships on first paint, straight
      # from .next's build manifests — deliberately excluding anything behind
      # next/dynamic (the PCB-hero canvas, the ⌘K palette, the HNSW wasm and
      # the embedding model must never count against paint). See scripts/check-bundle.ts for why `next
      # build`'s own output can't be scraped for this on Next 16.
      - name: Bundle size
        run: npm run check:bundle

      # Builds again (cheap here: Turbopack reuses the .next/cache the Build
      # step just warmed), serves the real production output on :3600, and
      # asserts Lighthouse's performance/accessibility/best-practices/SEO
      # scores plus explicit LCP and CLS budgets against every route listed
      # in lighthouserc.cjs. Runs last — it's the most expensive gate, and
      # everything above it fails faster on a simpler problem.
      #
      # Needs a real browser; ubuntu-latest ships Google Chrome, which
      # chrome-launcher finds automatically.
      - name: Lighthouse budgets
        run: npx lhci autorun --config=./lighthouserc.cjs

      # Reports (score breakdowns, traces, screenshots) for every run above,
      # kept whether the gate passed or failed — a failing score is much
      # easier to debug with the actual report than with a pass/fail line.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
